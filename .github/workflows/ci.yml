name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run docs:search:check
      - name: Unit and component regression tests
        run: npm test
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
